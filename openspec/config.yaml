schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  ## プロジェクト概要

  Sizet OpenBook は、個人開発アプリ「Sizet」（服のサイズを管理する iOS アプリ）の
  収益と費用を、個人開発者向けに公開するシステムである。
  日次の財務データを x402 による USDC 決済つきの有料 API として提供し、
  データが改ざんされていないことを Arc テストネット上のコントラクトに
  刻んだハッシュで第三者が検証できるようにする。

  Sizet 本体は別リポジトリ（`sizet`）であり、このプロジェクトから変更しない。
  Sizet の構成は Expo + Hono/Cloudflare Workers + Supabase + Claude API。

  対象とする収益源は AdMob 広告のみ。iOS サブスクリプションは 2026-08-15 に
  新規販売を停止し、既存加入者も 2026-09 中に満了するため対象外とする
  （将来サブスクを再開する場合は ③ のチェンジで追加する）。
  費用源は Claude API・Cloudflare・Resend・Supabase の 4 つ。

  ## 全体ロードマップ

  以下の 6 チェンジで構成し、依存順に進める。

  1. setup-openbook-foundation: 日次財務レコードの形式・保存規約・日次バッチと月次クローズの実行基盤
  2. collect-daily-cost: 4 プロバイダの費用を日次収集（1 に依存）
  3. collect-daily-revenue: AdMob の収益を日次収集（1 に依存、2 と並行可）
  4. anchor-daily-hash-on-arc: 月次クローズで確定した日次レコードのハッシュを
     Arc テストネットへ刻印・検証（2,3 に依存）
  5. serve-x402-paid-api: x402 による USDC 決済つき有料 API（2,3,4 に依存）
  6. build-public-dashboard: 支払いから可視化までのフロントエンド（5 に依存）

  ## 技術スタック

  TypeScript（strict） / Hono / Cloudflare Workers（Cron Triggers） / Cloudflare R2 /
  Vitest（@cloudflare/vitest-pool-workers） / pnpm ワークスペース。
  リレーショナル DB は使用しない。パッケージ構成は `apps/api` と `packages/shared`
  （正準化・10 進演算などフロントエンドと共有するロジック）。

  ## チェンジ横断の確定方針

  - 保存物・ハッシュ対象・API 公開物のバイト列を一致させる。日次レコードは
    正準 JSON（RFC 8785 + 配列の並び順規則）としてそのまま R2 に保存する
  - 集計基準通貨は JPY。為替は Frankfurter（ECB 公表値）を用い、原通貨・原金額・
    適用レート・公表日をレコードに残して再計算可能にする
  - レコードの対象日は UTC の暦日。取得元の集計タイムゾーンはエントリ側に記録する
  - 金額は文字列の 10 進小数で保持し、浮動小数点数を使わない
  - 保存済みオブジェクトは不変。訂正はリビジョン追加で行い、過去リビジョンを残す
  - 費用・収益の各エントリは取得方式（measured / derived / estimated）と、
    提供元が後から値を改訂しうるかを必ず保持する。レコード全体の確定状態は持たない
  - 取得できなかった対象は 0 円として扱わず、欠測として記録する
  - 保持するレコードは日次のみ。月次収支は日次レコードの集計として都度算出し、
    月次レコードは作らない
  - ハッシュ刻印は取得のたびではなく、翌月の月次クローズで各日の最終リビジョンを
    確定させた後に、その月の全日分をまとめて 1 回だけ行う。当月中の日次レコードは
    推定値の変動でリビジョンが増えてよく、その間は未刻印として扱う

  ## 外部依存について確認済みの事実

  以下は 2026-09 に実際の API を呼び出して確認した結果である。

  - Claude API: `GET /v1/organizations/cost_report` が日次バケット（`1d` のみ）で
    費用を返す。`group_by[]=description` でモデル別・入出力トークン別に分解できる。
    **`amount` の単位はセントである。**`currency` は `USD` と返るが、使用量レポートの
    トークン数と公開単価から計算した値と一致することを確認済み（例: 入力 10,071
    トークン × $1/MTok = $0.010071 に対し `amount` は `1.0071`）。そのまま USD として
    扱うと費用を 100 倍に誤って公開するため、必ず 1/100 して USD に直す。
    利用には Admin API キー（`sk-ant-admin01-`）が必要で、正式な組織を作成しないと
    発行できない。個人アカウントでは組織スコープの個人キーもサービスアカウントキーも
    403 `Missing permissions` になる。Admin キーはスコープを選択できず全権限を持つ
  - Cloudflare: 費用の確認は 3 つのエンドポイントを併用する。
    `GET /accounts/{id}/subscriptions` が契約中のサブスクリプションを返す（Workers
    Paid は月額 $5）。**R2 を有効にすると価格 0 USD の `R2 Paid`（`rate_plan.id` が
    `r2_paid`）が作成される**ため、空かどうかではなく価格で判定する。期間や時点を
    指定するパラメータはなく（公式ドキュメント）、過去の時点の契約は取得できない。応答には
    `client_secrets` 項目がある（確認時は null）。`GET /accounts/{id}/billable-usage` が従量課金を
    FOCUS 形式の行で返す。**無料枠に含まれる利用も請求額（`BilledCost`）0 の行として
    返る**ため、行の有無では従量課金の発生を判定できない（R2 の利用開始後、操作回数と
    保存容量の行が日単位の charge period で返ることを確認）。期間指定の **`to` は
    終了日を含まず、`from` より後でなければならない**（同日を指定すると 400）。
    **1 リクエストの期間は 90 日以内**（91 日で `max_date_range_days` エラー）。
    各行の `BillingAccountName` には請求先のメールアドレスを含むアカウント名が入る。
    `GET /accounts/{id}/billing/history` が請求実績を返す。ブログ記載の
    `/billing/usage/paygo` は存在しない（404）。
    必要権限は Billing Read。ただし同権限で `billing/profile` から氏名・住所も
    読めるため、バッチからは呼ばないこと
  - Resend: `GET /emails/metrics?dimensions=period` が日別の送信数を `data` 配列で
    返す（`dimensions` の許容値は period / domain / email / broadcast）。
    **遡及は約 30 日まで**で、それ以前を指定しても切り詰められる。課金額を返す API は
    なく、`x-resend-daily-quota` / `x-resend-monthly-quota` ヘッダは送信時のみで
    読み取り系エンドポイントでは返らない。API キーの権限は `full_access` と
    `sending_access`（送信のみ）の 2 種類で読み取り専用はなく、送信数の取得には
    `full_access` が必要
  - Supabase: `GET /v1/organizations/{slug}` が `plan`（`free` など）を返し、
    `GET /v1/projects/{ref}/billing/addons` の `selected_addons` が空なら有料アドオン
    （Custom Domain $10/月、Compute Instance など）は未適用。**read-only の PAT で
    両方とも取得できる**ことを確認済み。使用量を返すエンドポイントは存在しない
  - AdMob: `accounts.networkReport` で `DATE` / `WEEK` / `MONTH` のディメンションと
    任意の `dateRange` を指定でき、日次・週次・月次のいずれの粒度でも取得できる。
    ただし取得できるのは `ESTIMATED_EARNINGS`（推定値）のみで、API v1 には
    payments / transactions / 確定収益に相当するリソースが存在しない。確定額は
    管理画面の Transactions にしか現れないため、自動取得はできない。
    推定値は本プロジェクトではそのまま採用し、推定である旨を明示して公開する。
    データは約 4 時間遅延し、出現から最初の 48 時間は頻繁に変動する。
    レポートのタイムゾーンはアカウント既定か `America/Los_Angeles` のみで、
    レコードの対象日（UTC 暦日）とは境界がずれる。
    認証は OAuth 2.0 のみでサービスアカウントは非対応。`admob.report` スコープで
    `accounts.get` と `networkReport` の両方を取得できることを確認済み。
    sizet のアカウントは `pub-8277971573580991`、**レポートタイムゾーンは
    `Asia/Tokyo`、通貨は `JPY`**。応答は `header`・`row`・`footer` を並べた配列で、
    `ESTIMATED_EARNINGS` は `microsValue` の**文字列**、`FORMAT` の値は**小文字**
    （`banner` / `interstitial`）。`localizationSettings` を指定しなければ、ヘッダは
    アカウントの通貨を返す。`APP` の `matchesAny` フィルタでアプリを絞り込める。
    **59 日前まで取得できることを確認**（月次クローズに必要な約 37 日を満たす）。
    **要求した指標がすべて 0 の行は返らない**。指標を推定収益だけにすると、
    収益 0 の日は行が返らない（`AD_REQUESTS` など 0 でない指標を併せて要求した
    場合は、収益 0 の行も返る）
  - Apple（対象外）: `/v1/salesReports` は日次の推定値、`/v1/financeReports` は
    確定 proceeds を返すが Apple 会計月（4-4-5 週）基準で暦月とずれる。
    サブスク終了により対象外としたため、現時点では利用しない
  - 為替: Frankfurter（`api.frankfurter.dev`、ECB 公表値、API キー不要）を使う。
    ECB は営業日のみ公表するため、休場日は対象日以前で最新の公表日のレートを用いる
  - x402: CAIP-2 で任意の EVM チェーンを指定でき、Arc Testnet は `eip155:5042002`。
    テストネットは Circle の hosted facilitator が利用できる

  ## ドキュメント方針

  すべての OpenSpec 成果物（proposal.md, spec.md, design.md, tasks.md）は日本語で作成する。
  仕様書は人間がレビューしやすい、可読性の高い形式で記述する。
  不明点や判断が必要な事項は推測で補完せず、[要確認]として明示する。

# Per-artifact rules (additive to schema's built-in guidance)
rules:
  proposal:
    - Capabilities（ユーザーストーリー相当）は、互いに独立して実装・テスト・デプロイ可能な単位に分割する
  tasks:
    - タスクはユーザーストーリー単位で、互いに独立して実装・テスト・デプロイできるように分割する

# Per-operation guidance (advisory guidance for apply/archive work)
operations:
  apply:
    guidance:
      - テストファーストを原則とする。要件に沿ったテストをまず実装より先に作成し、実装はすべてのテストにパスすることを必須とする
